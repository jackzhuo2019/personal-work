<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="green1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3ecf8e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="380" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="700">Ops Knowledge Base (WeKnora) — Architecture</text>

  <!-- Input: Ops Documents -->
  <rect x="20" y="60" width="140" height="70" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="90" y="82" text-anchor="middle" fill="#e8e8e8" font-size="11" font-weight="600">Ops Documents</text>
  <text x="90" y="97" text-anchor="middle" fill="#888" font-size="9">8 sanitized docs</text>
  <text x="90" y="110" text-anchor="middle" fill="#888" font-size="9">SOP / Playbook</text>
  <text x="90" y="123" text-anchor="middle" fill="#888" font-size="9">Checklist / Guide</text>

  <!-- Arrow -->
  <line x1="160" y1="95" x2="195" y2="95" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- WeKnora core -->
  <rect x="195" y="50" width="410" height="100" rx="10" fill="#181818" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="700">WeKnora (Tencent, 33k★)</text>
  <text x="400" y="92" text-anchor="middle" fill="#888" font-size="9">Docker Compose — 5 containers</text>

  <!-- Inner pipeline -->
  <rect x="220" y="105" width="80" height="35" rx="6" fill="#0f1f0f" stroke="#22c55e" stroke-width="1"/>
  <text x="260" y="127" text-anchor="middle" fill="#22c55e" font-size="9">Chunking</text>
  <text x="260" y="115" text-anchor="middle" fill="#888" font-size="8">1000/140</text>

  <line x1="300" y1="122" x2="325" y2="122" stroke="#22c55e" stroke-width="1" marker-end="url(#arrow2)"/>

  <rect x="325" y="105" width="80" height="35" rx="6" fill="#0f1f0f" stroke="#22c55e" stroke-width="1"/>
  <text x="365" y="127" text-anchor="middle" fill="#22c55e" font-size="9">Embedding</text>
  <text x="365" y="115" text-anchor="middle" fill="#888" font-size="8">Vector</text>

  <line x1="405" y1="122" x2="430" y2="122" stroke="#22c55e" stroke-width="1" marker-end="url(#arrow2)"/>

  <rect x="430" y="105" width="80" height="35" rx="6" fill="#0f1f0f" stroke="#22c55e" stroke-width="1"/>
  <text x="470" y="127" text-anchor="middle" fill="#22c55e" font-size="9">Reranking</text>
  <text x="470" y="115" text-anchor="middle" fill="#888" font-size="8">Cross-enc.</text>

  <line x1="510" y1="122" x2="535" y2="122" stroke="#22c55e" stroke-width="1" marker-end="url(#arrow2)"/>

  <rect x="535" y="105" width="60" height="35" rx="6" fill="#0f1f0f" stroke="#22c55e" stroke-width="1"/>
  <text x="565" y="127" text-anchor="middle" fill="#22c55e" font-size="9">Retrieval</text>

  <!-- Arrow down -->
  <line x1="400" y1="150" x2="400" y2="180" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- API Layer -->
  <rect x="250" y="180" width="300" height="50" rx="8" fill="url(#green1)" stroke="none"/>
  <text x="400" y="202" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Knowledge-Search API</text>
  <text x="400" y="218" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">X-API-Key auth · POST /api/v1/knowledge-search</text>

  <!-- Arrow down -->
  <line x1="400" y1="230" x2="400" y2="260" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Consumers -->
  <rect x="120" y="260" width="160" height="50" rx="8" fill="#181818" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="282" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">AIOps Agent</text>
  <text x="200" y="297" text-anchor="middle" fill="#888" font-size="9">Alert → playbook query</text>

  <rect x="320" y="260" width="160" height="50" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="400" y="282" text-anchor="middle" fill="#e8e8e8" font-size="11" font-weight="600">Web UI</text>
  <text x="400" y="297" text-anchor="middle" fill="#888" font-size="9">Human Q&amp;A</text>

  <rect x="520" y="260" width="160" height="50" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="600" y="282" text-anchor="middle" fill="#e8e8e8" font-size="11" font-weight="600">Evaluation</text>
  <text x="600" y="297" text-anchor="middle" fill="#888" font-size="9">Retrieval accuracy</text>

  <!-- Infra labels -->
  <rect x="195" y="330" width="410" height="35" rx="6" fill="none" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="348" text-anchor="middle" fill="#888" font-size="9">PostgreSQL (ParadeDB) + Redis + Docreader + Frontend + App</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/>
    </marker>
  </defs>
</svg>