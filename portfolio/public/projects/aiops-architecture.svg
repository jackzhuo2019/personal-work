<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="800" height="520" fill="url(#bg)"/>
  <text x="400" y="28" text-anchor="middle" fill="#e8e8e8" font-size="15" font-weight="700">AIOps Agent — Architecture (v2: Execution Layer)</text>

  <!-- Row 1: Collect → Detect → Anomaly -->
  <rect x="20" y="50" width="110" height="45" rx="8" fill="#181818" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="75" y="70" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">Scheduler</text>
  <text x="75" y="84" text-anchor="middle" fill="#888" font-size="8">5 min interval</text>
  <line x1="130" y1="72" x2="160" y2="72" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="160" y="45" width="120" height="55" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="220" y="65" text-anchor="middle" fill="#e8e8e8" font-size="10" font-weight="600">Collectors</text>
  <text x="220" y="80" text-anchor="middle" fill="#888" font-size="8">Prometheus API</text>
  <text x="220" y="92" text-anchor="middle" fill="#888" font-size="8">Node + Pod metrics</text>
  <line x1="280" y1="72" x2="310" y2="72" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="310" y="45" width="120" height="55" rx="8" fill="#181818" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="370" y="65" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">Detectors</text>
  <text x="370" y="80" text-anchor="middle" fill="#888" font-size="8">Threshold checks</text>
  <text x="370" y="92" text-anchor="middle" fill="#888" font-size="8">CPU/Disk/Pod</text>
  <line x1="430" y1="72" x2="460" y2="72" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="460" y="50" width="110" height="45" rx="8" fill="#181818" stroke="#ef4444" stroke-width="1.5"/>
  <text x="515" y="70" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">Anomalies</text>
  <text x="515" y="84" text-anchor="middle" fill="#888" font-size="8">P0 / P1 / P2</text>

  <!-- Arrow down to execution layer -->
  <line x1="515" y1="95" x2="515" y2="130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Row 2: NEW — Command Execution Layer (L0) -->
  <rect x="340" y="130" width="380" height="70" rx="10" fill="#181818" stroke="#3b82f6" stroke-width="2"/>
  <text x="530" y="152" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">Command Execution Layer</text>
  <text x="530" y="167" text-anchor="middle" fill="#888" font-size="8">Whitelist-enforced · Permission-tiered</text>
  <rect x="360" y="175" width="80" height="20" rx="4" fill="#0f1a0f" stroke="#22c55e" stroke-width="1"/>
  <text x="400" y="188" text-anchor="middle" fill="#22c55e" font-size="8" font-weight="600">L0 Auto</text>
  <rect x="450" y="175" width="80" height="20" rx="4" fill="#1a1a0f" stroke="#f59e0b" stroke-width="1"/>
  <text x="490" y="188" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="600">L2 Approve</text>
  <rect x="540" y="175" width="80" height="20" rx="4" fill="#1a0f0f" stroke="#ef4444" stroke-width="1"/>
  <text x="580" y="188" text-anchor="middle" fill="#ef4444" font-size="8" font-weight="600">L4 Deny</text>

  <!-- Arrow down -->
  <line x1="530" y1="200" x2="530" y2="230" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Evidence collected -->
  <rect x="420" y="230" width="220" height="45" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="530" y="250" text-anchor="middle" fill="#e8e8e8" font-size="10" font-weight="600">Evidence Collected</text>
  <text x="530" y="264" text-anchor="middle" fill="#888" font-size="8">kubectl describe/logs/events output</text>

  <!-- WeKnora (optional, side) -->
  <line x1="420" y1="252" x2="370" y2="252" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrG)"/>
  <rect x="180" y="230" width="190" height="45" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="275" y="250" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">WeKnora (optional)</text>
  <text x="275" y="264" text-anchor="middle" fill="#888" font-size="8">Playbook context, not required</text>

  <!-- Arrow down to LLM -->
  <line x1="530" y1="275" x2="530" y2="305" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LLM Reasoning -->
  <rect x="360" y="305" width="340" height="55" rx="8" fill="url(#blue)"/>
  <text x="530" y="327" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Reasoning Agent (LLM)</text>
  <text x="530" y="342" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Synthesizes evidence + playbooks → root cause</text>
  <text x="530" y="354" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Proposes L2 operations if needed</text>

  <!-- Arrow down -->
  <line x1="530" y1="360" x2="530" y2="390" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output: Report + Audit + Escalation -->
  <rect x="200" y="390" width="140" height="50" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="270" y="410" text-anchor="middle" fill="#e8e8e8" font-size="10" font-weight="600">Audit Trail</text>
  <text x="270" y="424" text-anchor="middle" fill="#888" font-size="8">Every command logged</text>

  <line x1="340" y1="415" x2="370" y2="415" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="370" y="390" width="140" height="50" rx="8" fill="#181818" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="440" y="410" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">Report</text>
  <text x="440" y="424" text-anchor="middle" fill="#888" font-size="8">Markdown + JSON</text>

  <line x1="510" y1="415" x2="540" y2="415" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="540" y="390" width="160" height="50" rx="8" fill="#181818" stroke="#ef4444" stroke-width="1.5"/>
  <text x="620" y="410" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">Escalation</text>
  <text x="620" y="424" text-anchor="middle" fill="#888" font-size="8">Human approval for L2+</text>

  <!-- External services (bottom) -->
  <rect x="160" y="460" width="240" height="35" rx="6" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="280" y="478" text-anchor="middle" fill="#22c55e" font-size="9">WeKnora Knowledge Base (8 ops docs)</text>

  <rect x="420" y="460" width="220" height="35" rx="6" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="530" y="478" text-anchor="middle" fill="#3b82f6" font-size="9">LLM API: Qwen3.8-27B (OpenAI-compatible)</text>

  <!-- v2 badge -->
  <rect x="700" y="12" width="80" height="20" rx="4" fill="#3b82f6"/>
  <text x="740" y="25" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">v2 · L0 exec</text>
</svg>