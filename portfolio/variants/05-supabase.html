<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supabase Style</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#171717;--surface:#1c1c1c;--text:#fafafa;--muted:#898989;--accent:#3ecf8e;--border:#2e2e2e;--border2:#363636;--sans:'Inter',system-ui,sans-serif;--mono:'Source Code Pro',monospace}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;height:56px;border-bottom:1px solid var(--border)}
nav .brand{font-weight:600;color:#3ecf8e;text-decoration:none}
nav .links{display:flex;gap:20px;align-items:center}
nav .links a{color:#fafafa;text-decoration:none;font-size:14px;font-weight:500}
nav .links .cta{background:#3ecf8e;color:#000!important;padding:6px 20px;border-radius:9999px;font-weight:600}
.hero{padding:64px 0 48px}
.hero h1{font-size:2.6rem;font-weight:400;line-height:1;letter-spacing:-.8px;margin-bottom:8px}
.hero .role{font-size:1.15rem;color:var(--accent);margin-bottom:16px}
.hero p{color:var(--muted);font-size:.95rem;max-width:480px;margin-bottom:24px}
.btns{display:flex;gap:10px}
.btn-p{background:var(--accent);color:#000;padding:8px 24px;border-radius:9999px;font-size:.82rem;font-weight:600;text-decoration:none}
.btn-s{background:#0f0f0f;color:#fafafa;padding:8px 24px;border-radius:9999px;font-size:.82rem;border:1px solid var(--border2);text-decoration:none}
.section{padding:48px 0;border-top:1px solid var(--border)}
.section h2{font-size:1.3rem;font-weight:400;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;text-decoration:none;color:#fafafa}
.card-thumb{height:100px;background:#0f0f0f;border-bottom:1px solid var(--border)}
.card-body{padding:14px 16px}
.card-body h3{font-size:1rem;font-weight:400;letter-spacing:-.16px;margin-bottom:4px}
.card-body p{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.tags{display:flex;gap:6px}
.tag-pill{font-family:var(--mono);font-size:.72rem;padding:2px 10px;border-radius:6px;background:rgba(62,207,142,.12);color:var(--accent);border:1px solid rgba(62,207,142,.2)}
</style>
</head>
<body>
<div class="wrap">
<nav><a href="#" class="brand">● Your Name</a><div class="links"><a href="#">Projects</a><a href="#">Skills</a><a href="#" class="cta">Contact</a></div></nav>
<div class="hero">
<h1>Your Name</h1>
<div class="role">Full-Stack Developer</div>
<p>Solving real problems with code, shipping products that work.</p>
<div class="btns"><a href="#" class="btn-p">View Work</a><a href="#" class="btn-s">Contact Me</a></div>
</div>
<div class="section">
<h2>Projects</h2>
<div class="grid">
<a href="#" class="card"><div class="card-thumb"></div><div class="card-body"><h3>Project One</h3><p>One-line description</p><div class="tags"><span class="tag-pill">React</span><span class="tag-pill">Docker</span></div></div></a>
<a href="#" class="card"><div class="card-thumb"></div><div class="card-body"><h3>Project Two</h3><p>One-line description</p><div class="tags"><span class="tag-pill">FastAPI</span><span class="tag-pill">Redis</span></div></div></a>
</div>
</div>
</div>
</body>
</html>
