[project]
name = "aiops-agent"
version = "0.1.0"
description = "AIOps Intelligent Operations Assistant - LLM Agent for automated inspection, log analysis, and alert root-cause triage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]