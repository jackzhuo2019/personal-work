<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="800" height="460" fill="url(#bg1)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#e8e8e8" font-size="16" font-weight="700">AIOps Agent — Architecture</text>

  <!-- Step 1: Scheduler -->
  <rect x="20" y="55" width="120" height="50" rx="8" fill="#181818" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="78" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">Scheduler</text>
  <text x="80" y="93" text-anchor="middle" fill="#888" font-size="9">5 min interval</text>

  <!-- Arrow -->
  <line x1="140" y1="80" x2="175" y2="80" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Collectors -->
  <rect x="175" y="50" width="130" height="60" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="240" y="72" text-anchor="middle" fill="#e8e8e8" font-size="11" font-weight="600">Collectors</text>
  <text x="240" y="87" text-anchor="middle" fill="#888" font-size="9">Prometheus API</text>
  <text x="240" y="100" text-anchor="middle" fill="#888" font-size="9">Node + Pod metrics</text>

  <!-- Arrow -->
  <line x1="305" y1="80" x2="340" y2="80" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Detectors -->
  <rect x="340" y="50" width="130" height="60" rx="8" fill="#181818" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="405" y="72" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">Detectors</text>
  <text x="405" y="87" text-anchor="middle" fill="#888" font-size="9">Threshold checks</text>
  <text x="405" y="100" text-anchor="middle" fill="#888" font-size="9">CPU/Mem/Disk/Pod</text>

  <!-- Arrow -->
  <line x1="470" y1="80" x2="505" y2="80" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Anomaly list -->
  <rect x="505" y="55" width="120" height="50" rx="8" fill="#181818" stroke="#ef4444" stroke-width="1.5"/>
  <text x="565" y="78" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">Anomalies</text>
  <text x="565" y="93" text-anchor="middle" fill="#888" font-size="9">P0 / P1 / P2</text>

  <!-- Arrow down -->
  <line x1="565" y1="105" x2="565" y2="150" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: WeKnora Retriever -->
  <rect x="470" y="150" width="190" height="60" rx="8" fill="#181818" stroke="#22c55e" stroke-width="1.5"/>
  <text x="565" y="172" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">WeKnora Retriever</text>
  <text x="565" y="187" text-anchor="middle" fill="#888" font-size="9">Knowledge-search API</text>
  <text x="565" y="200" text-anchor="middle" fill="#888" font-size="9">Ops runbooks + playbooks</text>

  <!-- Arrow left to LLM -->
  <line x1="470" y1="180" x2="435" y2="180" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: LLM Reasoning Agent -->
  <rect x="250" y="150" width="185" height="60" rx="8" fill="url(#blue1)" stroke="none"/>
  <text x="342" y="172" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Reasoning Agent (LLM)</text>
  <text x="342" y="187" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Qwen3.8-27B</text>
  <text x="342" y="200" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Root-cause + actions</text>

  <!-- Arrow left -->
  <line x1="250" y1="180" x2="215" y2="180" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 7: Audit Trail -->
  <rect x="95" y="150" width="120" height="60" rx="8" fill="#181818" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="155" y="172" text-anchor="middle" fill="#e8e8e8" font-size="11" font-weight="600">Audit Trail</text>
  <text x="155" y="187" text-anchor="middle" fill="#888" font-size="9">JSONL log</text>
  <text x="155" y="200" text-anchor="middle" fill="#888" font-size="9">Every decision</text>

  <!-- Arrow down from LLM -->
  <line x1="342" y1="210" x2="342" y2="250" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 8: Report Generator -->
  <rect x="230" y="250" width="225" height="60" rx="8" fill="#181818" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="342" y="272" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">Report Generator</text>
  <text x="342" y="287" text-anchor="middle" fill="#888" font-size="9">Markdown + JSON</text>
  <text x="342" y="300" text-anchor="middle" fill="#888" font-size="9">Inspection report</text>

  <!-- Arrow down -->
  <line x1="342" y1="310" x2="342" y2="345" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 9: Escalation -->
  <rect x="230" y="345" width="225" height="50" rx="8" fill="#181818" stroke="#ef4444" stroke-width="1.5"/>
  <text x="342" y="368" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">Escalation (if P0/P1)</text>
  <text x="342" y="382" text-anchor="middle" fill="#888" font-size="9">Human on-call notification</text>

  <!-- External services -->
  <line x1="565" y1="210" x2="565" y2="250" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="490" y="250" width="150" height="40" rx="6" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="565" y="268" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="500">WeKnora (Docker)</text>
  <text x="565" y="282" text-anchor="middle" fill="#888" font-size="8">8 ops docs indexed</text>

  <line x1="342" y1="150" x2="342" y2="120" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="265" y="390" width="155" height="40" rx="6" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="342" y="408" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="500">LLM API (Qwen3.8-27B)</text>
  <text x="342" y="422" text-anchor="middle" fill="#888" font-size="8">OpenAI-compatible</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/>
    </marker>
  </defs>
</svg>