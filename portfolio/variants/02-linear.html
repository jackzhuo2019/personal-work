<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linear Style</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090a;--surface:#191a1b;--text:#f7f8f8;--muted:#8a8f98;--accent:#5e6ad2;--accent-h:#828fff;--border:rgba(255,255,255,.08);--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;height:56px;border-bottom:1px solid var(--border)}
nav .brand{font-weight:600;color:#f7f8f8;text-decoration:none;font-size:15px}
nav .links{display:flex;gap:20px}
nav .links a{color:#d0d6e0;text-decoration:none;font-size:13px;font-weight:510}
.hero{padding:64px 0 48px}
.hero h1{font-size:2.6rem;font-weight:510;letter-spacing:-1px;line-height:1;margin-bottom:6px}
.hero .role{font-size:1.2rem;color:var(--accent-h);font-weight:590;margin-bottom:16px}
.hero p{color:var(--muted);font-size:.95rem;max-width:480px;margin-bottom:24px}
.btns{display:flex;gap:10px}
.btn-p{background:var(--accent);color:#fff;padding:8px 16px;border-radius:6px;font-size:.85rem;font-weight:500;text-decoration:none}
.btn-g{background:rgba(255,255,255,.02);color:#e2e4e7;padding:8px 16px;border-radius:6px;font-size:.85rem;border:1px solid var(--border);text-decoration:none}
.section{padding:48px 0;border-top:1px solid var(--border)}
.section h2{font-size:1.3rem;font-weight:590;margin-bottom:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;overflow:hidden;text-decoration:none;color:#f7f8f8}
.card-thumb{height:100px;background:#191a1b;border-bottom:1px solid var(--border)}
.card-body{padding:14px 16px}
.card-body h3{font-size:1rem;font-weight:590;margin-bottom:4px}
.card-body p{font-size:.82rem;color:var(--muted);margin-bottom:10px}
.tags{display:flex;gap:6px}
.tag-pill{font-family:var(--mono);font-size:.72rem;padding:2px 8px;border-radius:9999px;background:rgba(94,106,210,.15);color:var(--accent-h);border:1px solid rgba(94,106,210,.2)}
</style>
</head>
<body>
<div class="wrap">
<nav><a href="#" class="brand">Your Name</a><div class="links"><a href="#">Projects</a><a href="#">Skills</a><a href="#">Contact</a></div></nav>
<div class="hero">
<h1>Your Name</h1>
<div class="role">Full-Stack Developer</div>
<p>Solving real problems with code, shipping products that work.</p>
<div class="btns"><a href="#" class="btn-p">View Work</a><a href="#" class="btn-g">Contact Me</a></div>
</div>
<div class="section">
<h2>Projects</h2>
<div class="grid">
<a href="#" class="card"><div class="card-thumb"></div><div class="card-body"><h3>Project One</h3><p>One-line description</p><div class="tags"><span class="tag-pill">React</span><span class="tag-pill">Docker</span></div></div></a>
<a href="#" class="card"><div class="card-thumb"></div><div class="card-body"><h3>Project Two</hh3><p>One-line description</p><div class="tags"><span class="tag-pill">FastAPI</span><span class="tag-pill">Redis</span></div></div></a>
</div>
</div>
</div>
</body>
</html>
